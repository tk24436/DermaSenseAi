server:
  port: ${PORT:8080}

spring:
  application:
    name: dermasense-auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dermasense}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: false

app:
  jwt:
    secret: ${JWT_SECRET:DermaSenseAiSuperSecretKeyThatIsAtLeast256BitsLongForSecureJwtAuth2026!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours (in milliseconds)
