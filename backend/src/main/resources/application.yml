server:
  port: ${PORT:8080}

spring:
  application:
    name: dermasense-auth-service

  # ── MongoDB (Embedded Flapdoodle runs automatically — no install needed) ──
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/dermasense}
      database: dermasense


app:
  jwt:
    secret: ${JWT_SECRET:DermaSenseAiSuperSecretKeyThatIsAtLeast256BitsLongForSecureJwtAuth2026!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
